name: UI verification
on:
  push:
    branches: [master]
    paths:
      - package.json
      - src/**
      - scripts/verify-ui.mjs
  workflow_dispatch:
permissions:
  contents: write
  statuses: read
concurrency:
  group: aarrkkaa-ui-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Refresh the security dependency lockfile
        run: |
          npm install --package-lock-only --ignore-scripts
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: lock patched TanStack Start dependencies"
            git push
          fi
      - name: Install project dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Wait for the production build
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module -e '
            import { execFileSync } from "node:child_process";
            const sha = execFileSync("git", ["rev-parse", "HEAD"], {encoding:"utf8"}).trim();
            for (let attempt = 0; attempt < 50; attempt++) {
              const response = await fetch("https://api.github.com/repos/" + process.env.REPOSITORY + "/commits/" + sha + "/status", {headers:{Authorization:"Bearer " + process.env.GH_TOKEN,Accept:"application/vnd.github+json"}});
              if (!response.ok) throw new Error("Unable to read deployment status: " + response.status);
              const status = await response.json();
              const deployment = status.statuses.find(item => item.context === "Vercel");
              if (deployment?.state === "success") process.exit(0);
              if (deployment?.state === "failure" || deployment?.state === "error") throw new Error("Production build failed: " + deployment.description);
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error("Production deployment did not finish in time");
          '
      - name: Audit desktop, mobile and product enquiry flow
        run: node scripts/verify-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aarrkkaa-ui-review
          path: ui-artifacts/
