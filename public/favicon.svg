<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Dark Luxury Navy-Charcoal Background for contrast on any browser tab -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Vibrant Golden Brass Gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Brilliant Metallic Silver/White for Peaks -->
    <linearGradient id="silver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Outer App Icon Rounded Rectangle (Bold Gold Border + Deep Dark Navy Fill) -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="url(#gold)" stroke-width="2.5" />

  <!-- Golden Mechanical Gear Ring (Bold and Distinct at 16x16 scale) -->
  <circle cx="32" cy="34" r="17" stroke="url(#gold)" stroke-width="3" fill="none" opacity="0.95" />

  <!-- Gear Cog Teeth (Thick lines radiating out) -->
  <g stroke="url(#gold)" stroke-width="4" stroke-linecap="round" opacity="0.95">
    <line x1="32" y1="11" x2="32" y2="15" />
    <line x1="32" y1="53" x2="32" y2="57" />
    <line x1="11" y1="34" x2="15" y2="34" />
    <line x1="49" y1="34" x2="53" y2="34" />
    <line x1="17" y1="19" x2="20" y2="22" />
    <line x1="44" y1="46" x2="47" y2="49" />
    <line x1="47" y1="19" x2="44" y2="22" />
    <line x1="20" y1="46" x2="17" y2="49" />
  </g>

  <!-- Double-'A' Mountain Peaks (Brilliant White/Silver with Shadow) -->
  <g filter="url(#shadow)">
    <!-- Left Peak -->
    <path d="M 12 48 L 26 22 C 27 20, 29 20, 30 22 L 40 48 L 34 48 L 28 34 L 22 48 Z" fill="url(#silver)" />
    <!-- Right Peak -->
    <path d="M 24 48 L 34 26 C 35 24, 37 24, 38 26 L 52 48 L 46 48 L 38 34 L 32 48 Z" fill="url(#silver)" />
  </g>

  <!-- Horizontal ARKA Accent Bar -->
  <rect x="18" y="36" width="28" height="5" rx="1.5" fill="#0F172A" stroke="url(#gold)" stroke-width="1.2" filter="url(#shadow)" />
</svg>
